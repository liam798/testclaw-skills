interface:
  display_name: "TestClaw CLI"
  short_description: "使用 testclaw-cli 完成 TestClaw 设备、应用、套件执行与全量证据采集"
  brand_color: "#4F46E5"
  default_prompt: "使用 $testclaw-cli。若是 TestClaw 业务请求，例如查设备、占用设备、安装/打开应用、打开浏览器/网页、执行套件、APK 自动化测试或真机验证，优先直接执行 testclaw-cli。任何会操作或观察真实设备 UI 的任务都必须先完成 evidence preflight：启动录屏、标记日志、准备网络记录、采基线截图和性能信息；缺证据时必须暂停或标注证据不完整。"
